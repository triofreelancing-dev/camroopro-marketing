name: Build & Deploy marketing service

on:
  workflow_dispatch:

  push:
    branches:
      - main

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: camroopro-marketing
  SERVICE_NAME: marketing
  EC2_NAME: Prod-Camroopro-server
  ECR_REGISTRY: 201611060191.dkr.ecr.ap-south-1.amazonaws.com

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:

      # ==========================================================
      # Checkout
      # ==========================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================================
      # Get and Decode GitHub OIDC Token
      #
      # IMPORTANT:
      # We only print claims. We NEVER print the actual token.
      # ==========================================================
      - name: Debug GitHub OIDC Token Claims
        run: |
          set -e

          echo "=============================="
          echo "Requesting GitHub OIDC token"
          echo "=============================="

          RESPONSE=$(curl -sS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          TOKEN=$(echo "${RESPONSE}" | jq -r '.value')

          if [ -z "${TOKEN}" ] || [ "${TOKEN}" = "null" ]; then
            echo "ERROR: Could not obtain GitHub OIDC token."
            echo "${RESPONSE}"
            exit 1
          fi

          echo "OIDC token received successfully."

          PAYLOAD=$(echo "${TOKEN}" | cut -d '.' -f2)

          # Add base64 padding
          case $((${#PAYLOAD} % 4)) in
            2)
              PAYLOAD="${PAYLOAD}=="
              ;;
            3)
              PAYLOAD="${PAYLOAD}="
              ;;
          esac

          echo "=============================="
          echo "OIDC CLAIMS"
          echo "=============================="

          echo "${PAYLOAD}" | base64 -d 2>/dev/null | jq '{
            iss,
            aud,
            sub,
            repository,
            repository_id,
            repository_owner,
            repository_owner_id,
            ref,
            sha
          }'

          echo "=============================="
          echo "Expected AWS OIDC subject"
          echo "=============================="

          echo "repo:${GITHUB_REPOSITORY}:ref:refs/heads/main"

      # ==========================================================
      # AWS Authentication via GitHub OIDC
      # ==========================================================
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-${{ github.run_id }}
          audience: sts.amazonaws.com
          retry-max-attempts: 1
          mask-aws-account-id: false

      # ==========================================================
      # Verify AWS Identity
      # ==========================================================
      - name: Verify AWS Identity
        run: |
          set -e

          echo "=============================="
          echo "AWS Identity"
          echo "=============================="

          aws sts get-caller-identity

      # ==========================================================
      # ECR Login
      # ==========================================================
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ==========================================================
      # Build & Push Docker Image
      # ==========================================================
      - name: Build, Tag and Push Image
        id: build
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -eux

          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)

          IMAGE_TAG="${SERVICE_NAME}-production-${SHORT_SHA}"
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          echo "Commit SHA : ${GITHUB_SHA}"
          echo "Short SHA  : ${SHORT_SHA}"
          echo "Image URI  : ${IMAGE_URI}"

          docker build \
            --build-arg APP_NAME="${SERVICE_NAME}" \
            -t "${IMAGE_URI}" \
            .

          docker push "${IMAGE_URI}"

          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_OUTPUT"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      # ==========================================================
      # Deploy to EC2 using SSM
      # ==========================================================
      - name: Deploy to EC2 via SSM
        env:
          IMAGE_URI: ${{ steps.build.outputs.IMAGE_URI }}
        run: |
          set -eux

          echo "=============================="
          echo "Deploying Marketing Service"
          echo "=============================="

          echo "Image URI:"
          echo "${IMAGE_URI}"

          COMMAND_ID=$(aws ssm send-command \
            --region "${AWS_REGION}" \
            --document-name "AWS-RunShellScript" \
            --targets "Key=tag:Name,Values=${EC2_NAME}" \
            --comment "Deploy marketing ${GITHUB_SHA}" \
            --parameters "commands=[
              \"set -eux\",
              \"cd /home/ubuntu\",
              \"echo ===== EC2 AWS IDENTITY =====\",
              \"aws sts get-caller-identity\",
              \"echo ===== ECR LOGIN =====\",
              \"aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${ECR_REGISTRY}\",
              \"echo ===== CURRENT IMAGE =====\",
              \"grep -A5 '^  marketing:' docker-compose.yml || true\",
              \"echo ===== UPDATING IMAGE =====\",
              \"sed -i '/^[[:space:]]*marketing:/,/^[[:space:]]*container_name:/ s|^[[:space:]]*image:.*|    image: ${IMAGE_URI}|' docker-compose.yml\",
              \"echo ===== UPDATED IMAGE =====\",
              \"grep -A5 '^  marketing:' docker-compose.yml\",
              \"echo ===== PULLING IMAGE =====\",
              \"docker compose pull marketing\",
              \"echo ===== STARTING SERVICE =====\",
              \"docker compose up -d marketing\",
              \"echo ===== SERVICE STATUS =====\",
              \"docker compose ps marketing\"
            ]" \
            --query "Command.CommandId" \
            --output text)

          echo "COMMAND_ID=${COMMAND_ID}" >> "$GITHUB_ENV"

          echo "SSM Command ID: ${COMMAND_ID}"

      # ==========================================================
      # Wait for SSM Completion
      # ==========================================================
      - name: Wait for Deployment Result
        env:
          COMMAND_ID: ${{ env.COMMAND_ID }}
        run: |
          set -eux

          MAX_ATTEMPTS=30
          ATTEMPT=0

          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            ATTEMPT=$((ATTEMPT + 1))

            STATUS=$(aws ssm list-command-invocations \
              --region "${AWS_REGION}" \
              --command-id "${COMMAND_ID}" \
              --details \
              --query "CommandInvocations[0].Status" \
              --output text)

            echo "Attempt ${ATTEMPT}/${MAX_ATTEMPTS}"
            echo "Current SSM Status: ${STATUS}"

            if [ "${STATUS}" = "Success" ]; then
              echo "=========================================="
              echo "Deployment completed successfully"
              echo "=========================================="

              aws ssm list-command-invocations \
                --region "${AWS_REGION}" \
                --command-id "${COMMAND_ID}" \
                --details

              exit 0
            fi

            if [ "${STATUS}" = "Failed" ] || \
               [ "${STATUS}" = "Cancelled" ] || \
               [ "${STATUS}" = "TimedOut" ] || \
               [ "${STATUS}" = "Cancelling" ]; then

              echo "=========================================="
              echo "Deployment failed"
              echo "=========================================="

              aws ssm list-command-invocations \
                --region "${AWS_REGION}" \
                --command-id "${COMMAND_ID}" \
                --details

              exit 1
            fi

            sleep 15
          done

          echo "Max attempts reached."
          exit 1
